<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin{% endblock %} – GES Attendance</title>
<style>
  :root{--ink:#1c2733;--muted:#5b6876;--paper:#f4f6f8;--panel:#fff;--line:#d5dbe1;--accent:#2c5f8a;
        --ok:#1f6b43;--ok-bg:#e6f3ec;--warn:#7a4f00;--warn-bg:#fbf0d9;--bad:#a3201a;--bad-bg:#fbe9e7;--neutral-bg:#eceff2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--ink);color:#fff}
  header .bar{max-width:76rem;margin:0 auto;padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;align-items:center}
  header strong{font-weight:650;margin-right:auto}
  header a,header button{color:#dbe4ee;text-decoration:none;background:none;border:0;font:inherit;cursor:pointer;padding:.25rem 0}
  header a:hover,header button:hover{color:#fff;text-decoration:underline}
  header a[aria-current]{color:#fff;text-decoration:underline;text-underline-offset:.3rem}
  main{max-width:76rem;margin:0 auto;padding:1.5rem 1rem 4rem}
  h1{font-size:1.6rem;line-height:1.2;margin:0 0 1rem}
  h2{font-size:1.15rem;margin:2rem 0 .75rem}
  .msg{padding:.6rem .9rem;border-radius:6px;margin:0 0 1rem;border:1px solid var(--line);background:var(--panel)}
  .msg.error{border-color:var(--bad);background:var(--bad-bg)} .msg.ok{border-color:var(--ok);background:var(--ok-bg)}
  .filters,.row-form{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:end;margin:0 0 1rem}
  label{display:flex;flex-direction:column;gap:.2rem;font-size:.9rem;color:var(--muted)}
  input,select,textarea{font:inherit;color:var(--ink);padding:.4rem .5rem;border:1px solid #aab4bf;border-radius:6px;background:#fff;min-height:2.4rem}
  input[type=checkbox]{min-height:0}
  button,.btn{font:inherit;padding:.45rem .9rem;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
  button.quiet,.btn.quiet{background:#fff;color:var(--accent)}
  button.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
  :focus-visible{outline:3px solid #f0b429;outline-offset:2px}
  .scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
  table{border-collapse:collapse;width:100%;font-size:.95rem}
  th,td{text-align:left;padding:.5rem .75rem;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
  th{font-weight:600;background:#f9fafb} tr:last-child td{border-bottom:0}
  td.wrap{white-space:normal}
  .chip{display:inline-block;padding:.05rem .5rem;border-radius:999px;font-size:.85rem;border:1px solid transparent;margin:0 .25rem .15rem 0}
  .chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
  .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.neutral{background:var(--neutral-bg);color:var(--muted)}
  .muted{color:var(--muted)} .summary{margin:0 0 1rem}
  details{margin:0 0 1rem;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.6rem .9rem}
  details summary{cursor:pointer;font-weight:600}
  .days{display:flex;flex-wrap:wrap;gap:.5rem 1rem;border:0;padding:0;margin:0}
  .days label{flex-direction:row;align-items:center;gap:.35rem;color:var(--ink)}
  .narrow{max-width:24rem;margin:4rem auto 0}
  .narrow form{display:flex;flex-direction:column;gap:1rem;background:var(--panel);padding:1.25rem;border:1px solid var(--line);border-radius:8px}
  @media (max-width:40rem){th,td{padding:.45rem .55rem}}
</style>
</head>
<body>
{% if session.admin_id %}
<header><div class="bar">
  <strong>GES Attendance</strong>
  <a href="{{ url_for('admin.attendance') }}" {% if request.endpoint in ('admin.attendance','admin.correct') %}aria-current="page"{% endif %}>Attendance</a>
  <a href="{{ url_for('admin.employees') }}" {% if request.endpoint == 'admin.employees' %}aria-current="page"{% endif %}>Employees</a>
  <a href="{{ url_for('admin.calendar') }}" {% if request.endpoint == 'admin.calendar' %}aria-current="page"{% endif %}>Holidays and leave</a>
  <a href="{{ url_for('admin.audit') }}" {% if request.endpoint == 'admin.audit' %}aria-current="page"{% endif %}>Audit log</a>
  <form method="post" action="{{ url_for('admin.logout') }}" style="margin:0"><input type="hidden" name="csrf" value="{{ admin_csrf() }}"><button type="submit">Sign out</button></form>
</div></header>
{% endif %}
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<p class="msg {{ cat }}" role="status">{{ m }}</p>{% endfor %}{% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
